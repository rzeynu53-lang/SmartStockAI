name: Build SmartStock AI

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Unzip project
    run: unzip -o SmartStockAI.zip

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 8.9

  - name: Run unit tests
    working-directory: SmartStockAI
    run: gradle testDebugUnitTest --no-daemon

  - name: Build debug APK
    working-directory: SmartStockAI
    run: gradle assembleDebug --no-daemon --stacktrace

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: SmartStock-debug-apk
      path: SmartStockAI/app/build/outputs/apk/debug/*.apk
